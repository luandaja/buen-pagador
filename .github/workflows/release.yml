name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, so two quick merges never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bump the version for every commit since the last tag
        id: bump
        run: echo "version=$(node scripts/release.mjs)" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN never trigger workflows, so this commit does not loop back here.
      - if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
